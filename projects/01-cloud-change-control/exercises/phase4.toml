[[exercise]]
id = "p4-aws-iam"
phase = 4
title = "AWS policy: wildcard IAM permissions"
file = "changegate/policies/aws.py"
stubs = ["IamWildcard.check"]
test = "test_p4_aws_iam.py"
task = '''
Implement `IamWildcard.check`. Skip unknown policies; invalid JSON yields a finding containing
`not valid JSON`. For each statement with `Effect` `"Allow"` (Sid defaults to `(no Sid)`):

- If it has `NotAction`, yield a finding containing `NotAction`.
- If `"*"` is among its actions, yield a **CRITICAL** finding `"statement '<sid>' allows every action ("*")"`.
- Otherwise, if `"*"` is among its resources and some actions end with `":*"` (like `s3:*`), yield
  `"statement '<sid>' allows s3:*, ec2:* on every resource"`.

`Action` and `Resource` may be a string or a list - use `as_list`.
'''
hints = [
  "Normalise: `actions = [str(a) for a in as_list(statement.get(\"Action\"))]`, same for resources.",
  "The NotAction check is independent of the others; the `\"*\"` action and the `svc:*` checks are an if/elif.",
  "broad = [a for a in actions if a.endswith(\":*\")]",
]

