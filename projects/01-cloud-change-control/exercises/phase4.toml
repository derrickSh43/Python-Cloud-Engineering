  "Pass `severity=Severity.CRITICAL` to `self.finding` for the all-ports case.",
  "`list(self.settings[\"sensitive_ports\"])` - settings come from config and may be any sequence.",
  "\", \".join(map(str, hits)) formats the port list.",
]

