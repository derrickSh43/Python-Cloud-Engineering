[[exercise]]
id = "p4-risk"
phase = 4
title = "Classify risk and decide"
file = "changegate/risk.py"
stubs = ["classify", "decide"]
test = "test_p4_risk.py"
task = '''
- `classify(changes, findings, cfg=None) -> (Severity, list[str])` (`cfg` defaults to `RiskConfig()`):
  - Ignore changes that don't change state. With no remaining changes **and** no findings, return
    `(LOW, ["the plan makes no changes"])`.
  - Risk starts as the highest finding severity (LOW if none). First reason:
    `"<n> finding(s); highest severity <LEVEL> (<k> at that level)"`, or with no findings
    `"no policy findings across <n> change(s)"`.
  - If the threshold is non-zero, the number of destructive changes reaches it, and risk is below
    CRITICAL, raise risk one level and add a reason containing `destructive`.
- `decide(risk, cfg=None) -> (Decision, str)`: BLOCK if `block_at` is set and risk >= it; else
  REQUIRE_APPROVAL if risk >= `approval_at`; else ALLOW. The string explains which threshold applied.
'''
hints = [
  "`max((f.severity for f in findings), default=Severity.LOW)` handles the empty case.",
  "Count destructive changes with `sum(1 for c in changes if c.action.is_destructive)`. `level.escalate()` raises it.",
  "decide: `if cfg.block_at is not None and risk >= cfg.block_at: return Decision.BLOCK, \"risk %s is at or above the block threshold (%s)\" % (risk, cfg.block_at)` - then the approval check, then ALLOW.",
]

[[exercise]]
id = "p4-evaluator"
phase = 4
title = "The evaluation pipeline"
file = "changegate/evaluator.py"
stubs = ["evaluate_changes", "evaluate_bytes", "evaluate_file"]
test = "test_p4_evaluator.py"
task = '''
Wire everything together:

- `evaluate_changes(changes, plan_sha256, config=None, policies=None) -> Evaluation`: default config
  `Config()`; default policies `load_policies(config.policies)`. Run the policies, **sort findings** by
  severity (highest first), then address, then policy id. Classify, decide, and return an `Evaluation`
  whose reasons are the classify reasons followed by the decision's explanation. `changes` and
  `findings` are stored as tuples.
- `evaluate_bytes(raw, config=None, policies=None)`: decode, parse, and evaluate with `plan_digest(raw)`.
- `evaluate_file(path, config=None, policies=None)`: read the bytes and call `evaluate_bytes`.
'''
hints = [
  "`sorted(..., key=lambda f: (-f.severity, f.address, f.policy_id))` - negating an IntEnum sorts high first.",
  "`level, reasons = risk.classify(...)` and `decision, why = risk.decide(...)`; reasons for the Evaluation are `tuple(reasons + [why])`.",
  "evaluate_bytes: plan = plan_parser.decode_plan(raw); changes = plan_parser.parse_plan(plan); return evaluate_changes(changes, plan_parser.plan_digest(raw), config, policies)",
]
