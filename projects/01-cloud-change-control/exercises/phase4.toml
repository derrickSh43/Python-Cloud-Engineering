- If `all_traffic` is True or the range covers all ports (`covers_all_ports`), yield one **CRITICAL**
  finding `"<label> allows ALL ports from the internet"` and stop.
- Otherwise find the sensitive ports inside the range (`range_includes_any` with
  `self.settings["sensitive_ports"]`). If any, yield one finding at the policy's normal severity:
  `"<label> exposes sensitive port(s) 22, 3389 to the internet"` (comma-separated).
'''
