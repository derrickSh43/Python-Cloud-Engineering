# Phase 4 - The policy engine: config, a plugin framework, AWS and GCP rules, risk and decisions.

[[exercise]]
id = "p4-networks"
phase = 4
title = "Is this CIDR the whole internet?"
file = "changegate/policies/helpers.py"
stubs = ["is_world", "any_world"]
test = "test_p4_networks.py"
task = '''
Implement with the standard `ipaddress` module:

- `is_world(cidr) -> bool`: True when the range covers the **entire** IPv4 or IPv6 internet - that is,
  its prefix length is 0 (`"0.0.0.0/0"`, `"::/0"`, and also sloppy forms like `" 0.0.0.0/0 "` or
  `"1.2.3.4/0"`). Invalid text returns False instead of raising.
- `any_world(cidrs) -> bool`: True if any item (use `as_list`, so a single string works) is world-open.
'''
hints = [
  "`ipaddress.ip_network(text, strict=False)` accepts host bits being set. The result has a `.prefixlen`.",
  "Catch `ValueError` for invalid input. Strip spaces with `str(cidr).strip()` first.",
  "any_world: `return any(is_world(c) for c in as_list(cidrs))`",
]

[[exercise]]
id = "p4-config-validation"
phase = 4
title = "Validate config values"
file = "changegate/config.py"
stubs = ["_reject_unknown", "_severity", "_str_list"]
test = "test_p4_config_validation.py"
task = '''
A typo in a config file must never silently weaken a rule. Implement three helpers in `config.py`:

- `_reject_unknown(data, allowed, where)`: if `data` has keys not in `allowed`, raise `ConfigError`
  starting with `unknown setting(s) in [<where>]: ` followed by the unknown keys, **sorted** and
  comma-separated. Otherwise return None.
- `_severity(value, where) -> Severity`: `Severity.parse(value)`, but a `ValueError` becomes
  `ConfigError("<where>: <original message>")`.
- `_str_list(value, where) -> tuple[str, ...]`: if `value` is a list of strings, return it as a tuple;
  otherwise raise `ConfigError("<where> must be a list of strings")`.
'''
hints = [
  "Set difference finds the extras: `set(data) - allowed`. `\", \".join(sorted(...))` formats them.",
  "`all(isinstance(v, str) for v in value)` checks every item; check `isinstance(value, list)` first.",
  "_severity: `try: return Severity.parse(value)  except ValueError as e: raise ConfigError(\"%s: %s\" % (where, e)) from None`",
]

[[exercise]]
id = "p4-config-risk"
phase = 4
title = "Load the [risk] section"
file = "changegate/config.py"
stubs = ["_risk"]
test = "test_p4_config_risk.py"
task = '''
Implement `_risk(data: dict) -> RiskConfig` for the `[risk]` table.

- Allowed keys: `approval_at`, `block_at`, `destructive_escalation_threshold` (reject others with
  `_reject_unknown(..., "risk")`).
- Missing keys use the defaults from `RiskConfig()`.
- `approval_at` and `block_at` are severities (use `_severity` with `where` like `"risk.approval_at"`).
  `block_at` may also be `"never"` or `"none"` (any case), meaning `None` - never block.
- If `block_at` is lower than `approval_at`, raise `ConfigError` containing `must not be lower`.
- `destructive_escalation_threshold` must be an `int` >= 0 and **not a bool** (in Python `True` is an
  int!); otherwise raise `ConfigError` containing `>= 0`.
'''
hints = [
  "Create `defaults = RiskConfig()` and use `data.get(\"approval_at\", defaults.approval_at)`.",
  "`str(raw_block).lower() in (\"never\", \"none\")` catches both spellings. Compare severities with `<` - they're IntEnums.",
  "if not isinstance(threshold, int) or isinstance(threshold, bool) or threshold < 0: raise ConfigError(\"risk.destructive_escalation_threshold must be a whole number >= 0\")",
]

[[exercise]]
id = "p4-config-load"
phase = 4
title = "Find and load the config file"
file = "changegate/config.py"
stubs = ["resolve_path", "load_config"]
test = "test_p4_config_load.py"
task = '''
Implement:

- `resolve_path(explicit=None, environ=None, cwd=None) -> Path | None`: an explicit path wins; else the
  environment variable named by `CONFIG_ENV` (`environ` defaults to `os.environ`); else
  `<cwd>/changegate.toml` **if that file exists** (`cwd` defaults to the current directory); else `None`.
- `load_config(path=None, environ=None) -> Config`: resolve the path; `None` → `Config()` defaults.
  Otherwise open it in binary mode and `tomllib.load` it. A missing file → `ConfigError` containing
  `not found`; bad TOML → `ConfigError` containing `not valid TOML`. Finally return
  `from_dict(data, source=resolved.resolve())`.
'''
hints = [
  "Check the three sources in order with early returns. `Path.cwd()` is the current directory and `path.is_file()` checks existence.",
  "`tomllib.load` needs a binary file: `open(resolved, \"rb\")`. Catch `FileNotFoundError` and `tomllib.TOMLDecodeError`.",
  "environ = os.environ if environ is None else environ; if explicit: return Path(explicit); if environ.get(CONFIG_ENV): return Path(environ[CONFIG_ENV]); candidate = (cwd or Path.cwd()) / DEFAULT_FILENAME; return candidate if candidate.is_file() else None",
]

[[exercise]]
id = "p4-policy-base"
phase = 4
title = "The Policy base class"
file = "changegate/policies/base.py"
stubs = ["Policy.applies_to", "Policy.finding"]
test = "test_p4_policy_base.py"
task = '''
Every policy subclasses `Policy`. Its `__init__` is written for you: it stores merged `settings`,
`self.level` (the effective severity) and `self.overridden` (True when config overrode the severity).
Implement:

- `applies_to(change) -> bool`: False if `change.action` isn't in the class's `actions`; otherwise True
  when `resource_types` is empty (meaning "every type") or contains `change.type`.
- `finding(change, message, remediation="", severity=None) -> Finding`: build a `Finding` with the
  policy's `id` and the change's `address`. Severity rules: if config overrode it, always use
  `self.level`; otherwise use the `severity` argument if given, else `self.level`.
'''
hints = [
  "Class attributes like `self.actions` and `self.resource_types` are reachable through `self`.",
  "An empty frozenset is falsy, so `not self.resource_types or change.type in self.resource_types` covers both cases.",
  "finding: `level = self.level if self.overridden else (severity or self.level)` then `return Finding(self.id, level, change.address, message, remediation)`",
]

[[exercise]]
id = "p4-registry"
phase = 4
title = "Discover policies with a decorator"
file = "changegate/policies/base.py"
stubs = ["register", "load_policies"]
test = "test_p4_registry.py"
task = '''
Implement the plugin registry:

- `register(cls)`: a class decorator. Raise `PolicyLoadError` if the class lacks `id`, `title` or
  `severity`. If another class with a **different `__qualname__`** already registered the same id, raise
  `PolicyLoadError` containing `duplicate`. Store it in `_REGISTRY[cls.id]` and **return the class**.
- `load_policies(policy_config=None) -> list[Policy]`: use `PolicyConfig()` when None. Call
  `import_modules(BUILTIN_MODULES + tuple(cfg.extra_modules))` (importing a module runs its
  `@register` decorators). Any id named in `cfg.disabled`, `cfg.severity_overrides` or `cfg.settings`
  that isn't registered → `PolicyLoadError` naming it. Then, for each registered id **in sorted
  order** that isn't disabled, create the policy with
  `cls(settings=cfg.settings.get(pid), severity=cfg.severity_overrides.get(pid))`.
'''
hints = [
  "`hasattr(cls, \"id\")` checks for an attribute. A decorator must return the class, or the name becomes None.",
  "`set(ids) - set(_REGISTRY)` finds unknown ids. Loop over the three config fields with their names so the error says which one.",
  "for pid in sorted(_REGISTRY): if pid in cfg.disabled: continue; policies.append(_REGISTRY[pid](settings=cfg.settings.get(pid), severity=cfg.severity_overrides.get(pid)))",
]

[[exercise]]
id = "p4-run-policies"
phase = 4
title = "Run policies and fail closed"
file = "changegate/policies/base.py"
stubs = ["run_policies"]
test = "test_p4_run_policies.py"
task = '''
Implement `run_policies(policies, changes)` as a **generator** that yields every finding from every
policy that `applies_to` each change (changes in order, policies in order for each change).

A gate must never silently skip a rule: if a policy's `check` raises any `Exception`, yield instead
`Finding(policy.id, Severity.CRITICAL, change.address, "policy raised <ExceptionType>: <message>", "...")`
and carry on with the next policy.
'''
hints = [
  "`policies` may be a one-shot iterator; turn it into a list first because you loop over it once per change.",
  "`yield from policy.check(change)` re-yields everything a policy yields. Put it inside `try:`.",
  "except Exception as e: yield Finding(policy.id, Severity.CRITICAL, change.address, \"policy raised %s: %s\" % (type(e).__name__, e), \"Fix the policy or the input; the change is blocked until then.\")",
]

[[exercise]]
id = "p4-destroy-stateful"
phase = 4
title = "Policy: deleting data-holding resources"
file = "changegate/policies/common.py"
stubs = ["DestroyStatefulResource.stateful_types", "DestroyStatefulResource.check"]
test = "test_p4_destroy_stateful.py"
task = '''
`DestroyStatefulResource` only runs for `DELETE` and `REPLACE` (see its `actions`). Implement:

- `stateful_types()`: every provider's stateful types (`providers.all_stateful_types()`), plus
  `self.settings["extra_types"]`, minus `self.settings["ignore_types"]`, as a frozenset.
- `check(change)`: a generator. If the change's type is stateful, yield one finding whose message is
  `"<type> holds data and will be deleted"` for a DELETE, or
  `"<type> holds data and will be destroyed and re-created (replaced)"` for a REPLACE, with a remediation
  telling the reader to confirm backups. Otherwise yield nothing.
'''
hints = [
  "Set arithmetic: `(set(a) | set(b)) - set(c)`.",
  "In a generator, a bare `return` just ends it with nothing yielded.",
  "verb = \"deleted\" if change.action == Action.DELETE else \"destroyed and re-created (replaced)\"; yield self.finding(change, \"%s holds data and will be %s\" % (change.type, verb), \"Confirm backups exist ...\")",
]

[[exercise]]
id = "p4-required-tags"
phase = 4
title = "Policy: required tags and labels"
file = "changegate/policies/common.py"
stubs = ["RequiredTags.check"]
test = "test_p4_required_tags.py"
task = '''
Implement `RequiredTags.check(change)` (a generator):

- Do nothing if `self.settings["required"]` is empty or the change's provider isn't registered
  (`providers.lookup(change.provider)` is None).
- Go through the provider's `tag_attributes` in order (AWS: `tags_all`, then `tags`; GCP: `labels`).
  Skip an attribute that isn't present in `change.attributes` at all (the resource doesn't support
  tags). For the **first** one that is present: if it's unknown (`change.is_unknown`), stop; otherwise
  yield one finding `"missing required <attribute>: <key1>, <key2>"` listing missing keys in the
  configured order (a `null` value counts as no tags), then stop.
'''
hints = [
  "`attribute not in attrs` means 'not present at all'; `attrs.get(attribute) or {}` turns a null into an empty dict.",
  "Use `return` after handling the first present attribute so you never check a second one.",
  "missing = [key for key in required if key not in present]; if missing: yield self.finding(change, \"missing required %s: %s\" % (attribute, \", \".join(missing)), ...)",
]

[[exercise]]
id = "p4-open-ingress"
