[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changegate"
version = "1.0.0"
description = "Policy-driven change control for Terraform plans (reference implementation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
changegate = "changegate.cli:main"

[tool.setuptools.packages.find]
include = ["changegate*"]
