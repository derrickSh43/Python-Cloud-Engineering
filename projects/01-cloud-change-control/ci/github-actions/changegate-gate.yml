# Cloud ChangeGate - offline CI gate (no cloud credentials needed).
#
# Copy this file to .github/workflows/changegate-gate.yml in YOUR repository (your fork of
# Python-Cloud-Engineering, or any repo that contains plan JSON files).
#
# Every setting comes from repository VARIABLES and SECRETS (Settings -> Secrets and variables ->
# Actions). Nothing is hard-coded; the defaults below point at this course's sample data so the
# workflow works as soon as it's copied.
#
#   Variables (all optional):
#     CHANGEGATE_PACKAGE   path to the ChangeGate package to install
#                          default: projects/01-cloud-change-control/workspace  (YOUR implementation;
#                          commit it with `git add -f projects/01-cloud-change-control/workspace`)
#     CHANGEGATE_CONFIG    path to changegate.toml
#                          default: projects/01-cloud-change-control/sample_data/changegate.example.toml
#     CHANGEGATE_PLANS     space-separated plan files to gate
#                          default: the safe AWS and GCP sample plans
#   Secrets (optional):
#     CHANGEGATE_HMAC_KEY  approval signing key; only needed to verify approvals
#
# Exit codes: 0 allowed/approved, 1 blocked, 2 approval required, 3 error. Any non-zero code fails
# the job, so risky plans stop the pipeline until they are fixed or properly approved.

name: changegate-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      CHANGEGATE_PACKAGE: ${{ vars.CHANGEGATE_PACKAGE || 'projects/01-cloud-change-control/workspace' }}
      CHANGEGATE_CONFIG: ${{ vars.CHANGEGATE_CONFIG || 'projects/01-cloud-change-control/sample_data/changegate.example.toml' }}
      CHANGEGATE_PLANS: ${{ vars.CHANGEGATE_PLANS || 'projects/01-cloud-change-control/sample_data/plans/aws_safe.json projects/01-cloud-change-control/sample_data/plans/gcp_safe.json' }}
      CHANGEGATE_HMAC_KEY: ${{ secrets.CHANGEGATE_HMAC_KEY }}
      # the person who opened the pull request can't approve their own change
      CHANGEGATE_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ChangeGate
        run: python -m pip install "./${CHANGEGATE_PACKAGE}"

      - name: Gate every plan
        shell: bash
        run: |
          worst=0
          for plan in ${CHANGEGATE_PLANS}; do
            echo "::group::${plan}"
            set +e
            changegate verify "${plan}" --approvals approvals --format markdown --output report.md
            code=$?
            set -e
            cat report.md >> "${GITHUB_STEP_SUMMARY}"
            echo "exit code ${code}"
            echo "::endgroup::"
            if [ "${code}" -gt "${worst}" ]; then worst=${code}; fi
          done
          case "${worst}" in
            0) echo "All plans allowed." ;;
            1) echo "::error::At least one plan is BLOCKED." ;;
            2) echo "::error::At least one plan needs approval." ;;
            *) echo "::error::ChangeGate reported an error." ;;
          esac
          exit "${worst}"

      - name: Show the audit trail head
        if: always()
        shell: bash
        run: changegate audit verify || true
